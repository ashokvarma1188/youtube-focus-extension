name: Daily Auto Commit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update activity log
        run: |
          mkdir -p .towline
          echo "Automated commit - $(date -u +'%Y-%m-%d %H:%M UTC')" >> .towline/activity-log.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .towline/activity-log.md
          git diff --staged --quiet || git commit -m "Automated daily commit"
          git push
